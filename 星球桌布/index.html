<title>小公主的星球</title>
<style>
  :root{
    --ui-bg: rgba(14,16,38,.62);
    --ui-line: rgba(255,240,200,.18);
    --ui-text: #f6eedb;
    --ui-dim: #b9b3c9;
    --ui-accent: #f5cf47;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#04050d;color:var(--ui-text);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
  canvas{display:block}
  #ui{position:fixed;right:28px;bottom:72px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
    transition:opacity .6s ease;user-select:none;z-index:5}
  #ui.dim{opacity:.16}
  #ui:hover{opacity:1}
  .wallpaper #ui{opacity:1}
  #ui button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--ui-line);background:var(--ui-bg);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;transition:background .2s,border-color .2s,transform .1s}
  #ui button:hover{background:rgba(40,42,80,.8);border-color:rgba(245,207,71,.5)}
  #ui button:active{transform:scale(.96)}
  #toggle{padding:8px 16px;font-size:14px;letter-spacing:.06em}
  #toggle[data-art]{display:flex;align-items:center;gap:7px}
  #toggle b{display:inline-block;min-width:20px;margin-left:6px;padding:1px 7px;border-radius:999px;background:rgba(245,207,71,.18);color:var(--ui-accent);font-weight:600}
  #panel{width:290px;padding:16px;border-radius:18px;background:var(--ui-bg);border:1px solid var(--ui-line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
  #panel[hidden]{display:none}
  .ttl{font-size:13px;color:var(--ui-dim);letter-spacing:.12em;margin:0 0 10px 2px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid button{border-radius:14px!important;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}
  .grid button span{font-size:12px;color:var(--ui-dim)}
  .row{display:flex;gap:6px;margin-top:12px}
  .row button{flex:1;padding:7px 4px;font-size:12px}
  .slider{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--ui-dim)}
  .slider input{flex:1;accent-color:var(--ui-accent)}
  .hint{margin-top:12px;font-size:11px;color:var(--ui-dim);line-height:1.5;opacity:.8}
  /* 操作面板：鄉村美式風格（亞麻、木頭、格紋、縫線） */
  #ui button{color:#3e2c20;background:#fffaf0;border:1.5px solid #dcc8a6;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 2px 0 #dcc8a6}
  #ui button:hover{background:#fff1d6;border-color:#c9a87c}
  #ui button:active{transform:translateY(2px);box-shadow:none}
  #toggle{color:#fdf3df!important;font-family:"Noto Serif TC","PMingLiU",Georgia,serif;letter-spacing:.14em!important;border-color:rgba(0,0,0,.15)!important;
    background:repeating-linear-gradient(91deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),linear-gradient(180deg,#a7744f,#8a5a3b)!important;box-shadow:0 2px 0 #5b3a24!important}
  #toggle b{background:#fffaf0;color:#a8432f}
  #panel{position:relative;color:#3e2c20;padding-top:22px;border:1px solid #dcc8a6;backdrop-filter:none;-webkit-backdrop-filter:none;
    background:repeating-linear-gradient(0deg,rgba(120,88,58,.045) 0 1px,transparent 1px 4px),#fbf6ea;
    outline:1.5px dashed #bfa27b;outline-offset:-7px;box-shadow:0 2px 0 #d9c6a2,0 10px 30px rgba(0,0,0,.35)}
  #panel::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;border-radius:18px 18px 0 0;
    background:repeating-linear-gradient(0deg,rgba(168,67,47,.42) 0 5.5px,transparent 5.5px 11px),repeating-linear-gradient(90deg,rgba(168,67,47,.42) 0 5.5px,transparent 5.5px 11px),#fff}
  #panel .ttl{color:#863322;font-family:"Noto Serif TC","PMingLiU",Georgia,serif;font-weight:700}
  #panel .grid button{border-radius:10px!important}
  #panel .grid button span,#panel .slider,#panel .hint{color:#7c6550}
  #panel .grid button span{font-family:"Noto Serif TC","PMingLiU",Georgia,serif}
  #panel .row button{border-radius:9px}
  #panel .slider input{accent-color:#8a5a3b}
  #panel{width:320px}

  #panel .tab.on{background:#7c9a6d;border-color:#62805a;color:#fbfff4;box-shadow:0 2px 0 #62805a}
  #panel .mbar{display:flex;align-items:center;gap:8px}

  /* 右下角創作人署名（在 Windows 工作列上方） */

  #ui{bottom:96px!important}

  /* 桌面月曆（只有行程和詳情可互動） */

    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 1vh 4vh rgba(0,0,0,.25);

  .cal-day.today .cal-n{color:var(--ui-accent);font-weight:700}
  .cal-n{font-size:clamp(10px,.78vw,16px);line-height:1.1}
  .cal-trigger{flex:none;pointer-events:auto;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left}
  .cal-trigger:hover,.cal-trigger:focus-visible,.cal-trigger[aria-expanded="true"]{background:rgba(255,255,255,.16)}
  .cal-ev{font-size:clamp(8px,.56vw,12px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

  #calDetails{position:fixed;z-index:5;box-sizing:border-box;width:max-content;min-width:min(220px,calc(100vw - 16px));
    max-width:min(360px,calc(100vw - 16px));padding:12px 14px;border:1px solid rgba(255,240,200,.28);
    border-radius:12px;background:#191a30;color:var(--ui-text);box-shadow:0 8px 24px #0008;pointer-events:none}

  #calDetailsWhen{font-size:12px;color:var(--ui-accent)}
  #calDetailsTitle{margin-top:5px;padding-left:8px;border-left:3px solid var(--c);font-weight:700;font-size:15px;
    white-space:pre-wrap;overflow-wrap:anywhere}
  #calDetailsNav:not([hidden]){display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}

  #calDetailsNav button:disabled{opacity:.4;cursor:default}
  #err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ccc;font-size:14px;display:none;text-align:center}
</style>

<body>

<script type="module">
// three.js、模型載入器、小公主程式與模型：離線版全部內嵌在頁面裡（不需網路），開發版從 CDN 與本機檔案載入
const srcOf = id => { const el = document.getElementById(id); return el ? el.textContent : ''; };
const blobUrl = code => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
const _src = srcOf('three-src');
const EMBED = _src.length > 10000;
let THREE, GLTFLoader, createPrincess, princessGLB;
if (EMBED) {
  const threeUrl = blobUrl(_src);                       // 所有模組共用同一份 three.js
  THREE = await import(threeUrl);
  const toThree = code => code.replace(/from\s*['"]three['"]/g, `from '${threeUrl}'`);
  const bguUrl = blobUrl(toThree(srcOf('bgu-src')));
  ({ GLTFLoader } = await import(blobUrl(toThree(srcOf('gltf-src')).replace(/['"]\.\.\/utils\/BufferGeometryUtils\.js['"]/g, `'${bguUrl}'`))));
  ({ createPrincess } = await import(blobUrl(srcOf('rig-src'))));
  princessGLB = Uint8Array.from(atob(srcOf('glb-src').trim()), c => c.charCodeAt(0)).buffer;
} else {
  THREE = await import('three');
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
  ({ createPrincess } = await import('./princess-rig.js'));
  princessGLB = await (await fetch('models/princess.glb')).arrayBuffer();
}
const PARAMS = new URLSearchParams(location.search);
const WALL = PARAMS.has('wallpaper');           // 由安裝程式設為桌布時的模式
const MIRROR = PARAMS.get('mirror');            // 其他螢幕上的複本：只顯示，不存檔、不接收指令
const DISPLAY_KEY = 'planet-wallpaper-display';    // 'primary' | 'secondary' | 'all'

/* ================= 基本工具 ================= */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const UP = new THREE.Vector3(0, 1, 0);
const R = 3;                 // 星球半徑
const PRINCE_H = 0.9;        // 小公主身高（含皇冠）

function hash3(x, y, z) { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  return L(
    L(L(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), L(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    L(L(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), L(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w);
}
function fbm(x, y, z, o = 4) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; a *= .5; f *= 2.03; } return s / n; }
function dirFrom(lat, lon) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo));
}
function randUnit() {
  const u = rand(-1, 1), th = rand(0, Math.PI * 2), s = Math.sqrt(1 - u * u);
  return new THREE.Vector3(s * Math.cos(th), u, s * Math.sin(th));
}

/* 地形高度：fbm 起伏 + 隕石坑，北極（小公主站的地方）壓平 */
const CRATERS = [[dirFrom(8, 70), .13, .05], [dirFrom(-25, 150), .18, .06], [dirFrom(-50, -40), .15, .05],
                 [dirFrom(30, -150), .1, .04], [dirFrom(-12, -95), .09, .035]];
function heightAt(d) {
  let h = (fbm(d.x * 1.7 + 11, d.y * 1.7 + 3, d.z * 1.7 + 7, 4) - .5) * .22;
  h += (vnoise(d.x * 7, d.y * 7, d.z * 7) - .5) * .03;
  for (const [cd, cr, dep] of CRATERS) {
    const a = Math.acos(clamp(d.dot(cd), -1, 1)) / cr;
    if (a < 1.6) { if (a < 1) h -= (1 - a * a) * dep; h += Math.exp(-(((a - 1) / .2) ** 2)) * dep * .45; }
  }
  return R + h * (1 - smooth(.9, .975, d.y) * .9);
}

/* ================= 渲染器 / 場景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });

const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform float uTime; varying vec3 vDir;
    float hash(vec3 p){ p = fract(p*0.3183099+.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y), f.z); }
    float fbm(vec3 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = mix(vec3(.012,.014,.04), vec3(.035,.03,.09), smoothstep(-.7,.8,d.y));
      float n  = fbm(d*2.3 + vec3(0., uTime*.003, 0.));
      float n2 = fbm(d*4.6 + vec3(5.2, 1.3, uTime*.004));
      float n3 = fbm(d*9.0 + vec3(2.1, 7.7, 3.3));
      vec3 bandN = normalize(vec3(.38, 1., .22));
      float band = exp(-pow(dot(d, bandN)/.3, 2.));
      vec3 neb = vec3(.36,.13,.5) * smoothstep(.42,.82,n) * .8
               + vec3(.05,.3,.45) * smoothstep(.48,.88,n2) * .65
               + vec3(.55,.22,.35) * smoothstep(.6,.9,n*n2*1.6) * .35;
      col += neb * (.28 + .9*band);
      col += vec3(.16,.14,.22) * band * smoothstep(.35,.8,n3) * .55;
      gl_FragColor = vec4(col, 1.);
    }`
}));

// 岩石星球：頂點顏色依雜訊混色，表面微微起伏
function rockyPlanet(r, colors, bump = .05, seg = 48, seed = 0) {
  const g = new THREE.SphereGeometry(r, seg, Math.round(seg * .75));
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), v = new THREE.Vector3(), c = new THREE.Color();
  const cs = colors.map(h => new THREE.Color(h));
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const n = fbm(v.x * 2.2 + seed, v.y * 2.2 + seed * .7, v.z * 2.2, 4);
    v.multiplyScalar(r * (1 + (n - .5) * bump));
    pos.setXYZ(i, v.x, v.y, v.z);
    const k = clamp((n - .3) / .45, 0, .999) * (cs.length - 1), j = Math.floor(k);
    c.copy(cs[j]).lerp(cs[Math.min(j + 1, cs.length - 1)], k - j);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95 }));
}

const energies = [];
function addEnergy(holder, r, color) {
  const sp = (map, op) => new THREE.Sprite(new THREE.SpriteMaterial({ map, color, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending }));
  const aura = sp(softTex, .2); aura.scale.setScalar(r * 3.4);
  const wave = sp(waveTex, 0); wave.scale.setScalar(r * 2.2);
  const sparks = [];
  for (let i = 0; i < 14; i++) { const s = sp(softTex, 0); s.scale.setScalar(r * .2); s.userData.dir = randUnit(); sparks.push(s); }
  holder.add(aura, wave, ...sparks);
  energies.push({ r, aura, wave, sparks, t: -1, next: rand(2, 12), dur: rand(2.4, 3.4), ph: Math.random() * 6 });
}

function updEnergy(dt, t) {
  for (const e of energies) {
    let glow = .16 + Math.sin(t * .7 + e.ph) * .06, size = 3.4;
    if (e.t < 0) {
      e.next -= dt;
      if (e.next < 0) { e.t = 0; e.sparks.forEach(s => s.userData.dir = randUnit()); }
    } else {
      e.t += dt;
      const k = Math.min(1, e.t / e.dur), swell = Math.sin(Math.PI * Math.min(1, k * 1.6));
      glow += .5 * swell; size += 1.3 * swell;
      e.wave.scale.setScalar(e.r * (2.2 + k * 5));
      e.wave.material.opacity = (1 - k) * .6 * Math.min(1, k * 8);
      e.sparks.forEach(s => { s.position.copy(s.userData.dir).multiplyScalar(e.r * (1.05 + k * 2.4)); s.material.opacity = (1 - k) * .9 * Math.min(1, k * 6); });
      if (k >= 1) { e.t = -1; e.next = rand(8, 20); e.wave.material.opacity = 0; e.sparks.forEach(s => s.material.opacity = 0); }
    }
    e.aura.material.opacity = glow; e.aura.scale.setScalar(e.r * size);
  }
}

  const ang = Math.PI + rand(.32, .72);

  m.position.set(rand(-hw * .3, hw * 1.15), rand(hh * .25, hh * 1.05), z);
  m.rotation.z = ang;
  const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: 0xfff6e0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));

function updMeteors(dt) {
  if (showerLeft > 0 && !wasShower) princeCheer();       // 流星雨開始
  wasShower = showerLeft > 0;
  meteorClock -= dt * meteorRate;
  if (meteorClock < 0) { meteorClock = rand(3, 10); if (Math.random() < .07) showerLeft = Math.floor(rand(5, 9)); else spawnMeteor(); }
  if (showerLeft > 0) { showerClock -= dt; if (showerClock < 0) { spawnMeteor(); showerLeft--; showerClock = rand(.15, .6); } }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const o = meteors[i]; o.age += dt;
    const k = o.age / o.life;
    const op = Math.min(1, o.age / .15) * (1 - smooth(.6, 1, k));
    o.m.position.addScaledVector(o.dir, o.speed * dt);
    o.m.scale.set(o.len * Math.min(1, o.age / .25), o.w, 1);
    o.m.material.uniforms.uOpacity.value = op;
    o.head.position.copy(o.m.position); o.head.material.opacity = op * .9;
    if (o.age > o.life) { scene.remove(o.m, o.head); o.m.material.dispose(); o.head.material.dispose(); meteors.splice(i, 1); }
  }
}

  let s = null, sh = null;

  if (mirrorShower !== null && sh !== mirrorShower && Date.now() - Number(sh) < 5000) { showerLeft = 12; showerClock = 0; }
  mirrorShower = sh;
  if (!s || !Array.isArray(s.list)) return;
  if (s.spd != null) rotSpeed = s.spd / 100 * .2;
  if (s.met != null) meteorRate = s.met / 50;
  const now = s.list.filter(c => BUILD[c.t]), sig = now.map(c => c.t).join(',');
  if (mirrorSig === null) { mirrorSig = sig; return; }
  if (sig === mirrorSig) return;
  const cur = creatures.map(c => c.type).join(',');
  if (sig.startsWith(cur)) now.slice(creatures.length).forEach(c => addCreature(c.t, new THREE.Vector3().fromArray(c.d)));
  else if (cur.startsWith(sig)) while (creatures.length > now.length) removeCreature(creatures[creatures.length - 1]);

let managerAck = 0, syncingManager = false;
const managerDecoder = new TextDecoder();
async function syncManager() {
  if (syncingManager) return;

  try {
    const response = await fetch('/wallpaper-state?ack=' + managerAck, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Desktop-Input': desktopToken },
      body: snapshot()
    });
    if (!response.ok) return;
    for (const [id, payload] of await response.json()) {
      if (id <= managerAck) continue;
      try {
        const bytes = Uint8Array.from(atob(payload), character => character.charCodeAt(0));
        runCmd(JSON.parse(managerDecoder.decode(bytes)));
      } catch (error) { console.warn('無法處理管理視窗指令', error); }
      managerAck = id;
    }
  } catch (error) { /* 下一次輪詢會繼續同步 */ }

}

    if (d.getMonth() === m) monthCount += list.length;
    const max = weeks > 5 ? 2 : 3;
    list.slice(0, max).forEach(e => {
      const ev = createCalTrigger('cal-ev', (e.time ? e.time + ' ' : '') + (e.title || ''), [e]);
      ev.style.setProperty('--c', calEventColor(e));
      cell.append(ev);
    });
    if (list.length > max) cell.append(createCalTrigger('cal-more', `+${list.length - max} 個行程`, list.slice(max)));
    grid.append(cell);
  }
  document.getElementById('calM').textContent = `${m + 1}月`;
  document.getElementById('calY').textContent = `${y} · ${MONTH_EN[m].toUpperCase()}`;
  document.getElementById('calSub').textContent = monthCount ? `本月有 ${monthCount} 個行程` : '本月還沒有行程';
}
renderCal(true);
setInterval(() => renderCal(false), 1000);
addEventListener('storage', e => { if (e.key === CAL_KEY) renderCal(true); });

/* ---------- 面板分頁：星球居民 / 行事曆 ---------- */
panel.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  panel.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  panel.querySelectorAll('[data-pane]').forEach(p => p.hidden = p.dataset.pane !== b.dataset.tab);
});

/* ---------- 行事曆編輯（面板與 Lively「自訂」共用） ---------- */
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const validYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseYmd(s));
function loadCal() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem(CAL_KEY) || '{}') || {}; } catch (e) { c = {}; }
  return { events: Array.isArray(c.events) ? c.events : [], view: c.view && c.view.mode === 'fixed' ? c.view : { mode: 'auto' } };
}
function saveCal(c) { try { localStorage.setItem(CAL_KEY, JSON.stringify(c)); } catch (e) { /* 忽略 */ } renderCal(true); renderCalEditor(); }
function calViewYM(c) { const n = new Date(); return c.view.mode === 'fixed' ? [c.view.y, c.view.m] : [n.getFullYear(), n.getMonth()]; }
function calShift(delta) {
  const c = loadCal(), [y, m] = calViewYM(c), d = new Date(y, m + delta, 1);
  c.view = { mode: 'fixed', y: d.getFullYear(), m: d.getMonth() }; saveCal(c);
}
function calGoToday() { const c = loadCal(); c.view = { mode: 'auto' }; saveCal(c); }
function calAdd(date, time, title, color) {
  title = String(title || '').trim().slice(0, 40);
  if (!validYmd(date) || !title) return false;
  if (!/^\d{2}:\d{2}$/.test(time || '')) time = '';
  const c = loadCal();
  c.events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date, time, title, color: /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#a8432f' });
  saveCal(c); return true;
}
function calDelete(id) { const c = loadCal(); c.events = c.events.filter(e => e.id !== id); saveCal(c); }

let calColor = '#a8432f';
const cEl = id => document.getElementById(id);
cEl('cPrev').onclick = () => calShift(-1);
cEl('cNext').onclick = () => calShift(1);
cEl('cNow').onclick = () => calGoToday();
cEl('cSw').querySelectorAll('.sw').forEach(b => b.onclick = () => { calColor = b.dataset.c; cEl('cSw').querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
function addFromPanel() {
  if (calAdd(cEl('cDate').value, cEl('cTime').value, cEl('cTitle').value, calColor)) { cEl('cTitle').value = ''; cEl('cTime').value = ''; }
  else cEl('cTitle').focus();
}
cEl('cAdd').onclick = addFromPanel;
cEl('cTitle').addEventListener('keydown', e => { if (e.key === 'Enter') addFromPanel(); });
cEl('cDate').value = ymd(new Date());
function renderCalEditor() {
  const c = loadCal(), [y, m] = calViewYM(c);
  cEl('cName').textContent = `${y} 年 ${m + 1} 月`;
  cEl('cMode').textContent = c.view.mode === 'fixed' ? '桌面固定顯示此月' : '桌面自動跟隨當月';
  cEl('cMode').classList.toggle('fixed', c.view.mode === 'fixed');
  const prefix = `${y}-${String(m + 1).padStart(2, '0')}-`;
  const list = c.events.filter(e => typeof e.date === 'string' && e.date.startsWith(prefix))
    .sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
  const box = cEl('cList'); box.replaceChildren();
  if (!list.length) { const e = document.createElement('div'); e.className = 'cempty'; e.textContent = '這個月還沒有行程'; box.append(e); }
  for (const e of list) {
    const d = parseYmd(e.date);
    const row = document.createElement('div'); row.className = 'cev'; row.style.setProperty('--c', e.color || '#a8432f');
    const bar = document.createElement('span'); bar.className = 'bar';
    const when = document.createElement('div'); when.className = 'when'; when.textContent = `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）` + (e.time ? `\n${e.time}` : '');
    const what = document.createElement('div'); what.className = 'what'; what.textContent = e.title;
    const del = document.createElement('button'); del.className = 'del'; del.title = '刪除這個行程';
    del.setAttribute('aria-label', del.title); del.dataset.art = 'remove';
    del.onclick = () => calDelete(e.id);
    row.append(bar, when, what, del); box.append(row);
  }
}
renderCalEditor();
addEventListener('storage', e => { if (e.key === CAL_KEY) renderCalEditor(); });
// 標題讓安裝程式找到桌布視窗（主桌布 / 其他螢幕的複本）
if (WALL) {
  document.body.classList.add('wallpaper');
  document.title = MIRROR ? 'PlanetWallpaper|mirror|' + MIRROR : 'PlanetWallpaper|main|' + displayMode();
}

scene.updateMatrixWorld(true);
load();
save();
setInterval(save, 15000);
addEventListener('beforeunload', save);

/* ================= 主迴圈 ================= */
let last = performance.now(), time = 0;
const CLOSE = new URLSearchParams(location.search).has('close');   // 近拍檢視：index.html?close
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  idleT += dt; if (idleT > 4 && !ui.matches(':hover')) ui.classList.add('dim');

  planet.rotation.y += rotSpeed * dt;
  for (const [o, s] of SPINNERS) o.rotation.y += dt * s;
  updEnergy(dt, time);
  stars.rotation.y += dt * .002;
  sky.material.uniforms.uTime.value = time; starMat.uniforms.uTime.value = time;

  mouse.sx += (mouse.x - mouse.sx) * (1 - Math.exp(-dt * 1.5));
  mouse.sy += (mouse.y - mouse.sy) * (1 - Math.exp(-dt * 1.5));
  if (CLOSE) {
    const p = planetPivot.position;
    camera.position.set(p.x - 2.2, 2.2, 9.5); camera.lookAt(p.x, .6, 0);
  } else {
    camera.position.set(mouse.sx * .7 + Math.sin(time * .05) * .3, -mouse.sy * .45 + Math.sin(time * .07) * .15, CAM_Z);
    camera.lookAt(0, 0, 0);
  }

  for (const c of creatures) {
    if (c.spawn < 1) { c.spawn = Math.min(1, c.spawn + dt / .6); const s = c.spawn, b = 1 + 2.2 * Math.pow(s - 1, 3) + 1.2 * Math.pow(s - 1, 2); c.g.scale.setScalar(Math.max(.001, b)); }
    if (c.kind === 'ground') updGround(c, dt, time);
    else if (c.kind === 'bird') updBird(c, dt, time);
    else updButterfly(c, dt, time);
  }
  interactions(dt);
  updPrince(dt, time);
  updDecor(dt, time);
  updMeteors(dt);
  updateBubbles(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// 頁面準備好後才接手 Lively 的設定；先前送來的（排在 __lpq 裡）依序補做
window.livelyPropertyListener = (n, v) => { try { onLivelyProp(n, v); } catch (e) { /* 忽略 */ } };
for (const [n, v] of (window.__lpq || []).splice(0)) window.livelyPropertyListener(n, v);
</script>
<script>
  // 若 three.js 未能載入（例如離線），顯示提示
  setTimeout(() => { if (!document.querySelector('canvas')) document.getElementById('err').style.display = 'block'; }, 6000);
</script>
