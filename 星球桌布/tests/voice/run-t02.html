<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>T02 語音辨識測試</title>
<style>body{font:14px "Microsoft JhengHei",sans-serif;margin:16px}table{border-collapse:collapse;font-size:12px}td,th{border:1px solid #ccc;padding:3px 6px}.bad{background:#fde8e4}</style>
</head>
<body>
<h1>T02：Vosk 離線語音辨識 + 意圖判斷</h1>
<p>使用產品相同的 vosk.js、vosk-model-small-cn-0.22、opencc-js 與 local-intent.js。音檔為 Windows 本機聲線合成（非真人錄音），另加 15 dB 背景噪音版本。</p>
<div id="st">準備中…</div>
<pre id="sum"></pre>
<table id="tbl"><thead><tr><th>音檔</th><th>參考句</th><th>辨識結果</th><th>CER</th><th>預期意圖</th><th>判斷意圖</th></tr></thead><tbody></tbody></table>
<script src="../../ai/lib/vosk.js"></script>
<script type="module">
import { SENTENCES as MAIN } from '../ai/sentences.mjs';
import { HOLDOUT } from '../ai/sentences-holdout.mjs';
import { HOLDOUT2 } from '../ai/sentences-holdout2.mjs';
const SETS = { main: [MAIN, '16k/'], holdout: [HOLDOUT, '16k-holdout/'], holdout2: [HOLDOUT2, '16k-holdout2/'] };
const SET = SETS[new URLSearchParams(location.search).get('set')] ? new URLSearchParams(location.search).get('set') : 'main';
const [SENTENCES, DIR] = SETS[SET];
import { classify } from '../../ai/local-intent.js';
import { Converter } from '../../ai/lib/opencc-cn2t.js';
const conv = Converter({ from: 'cn', to: 'twp' });
const NOW = new Date(2026, 10, 27, 10, 0);   // 與 T03 相同的基準時間（日期解析不影響意圖類別）
const EQUIV = { '周': '週', '台': '臺', '裏': '裡', '着': '著', '妳': '你', '么': '麼' };
const norm = s => [...String(s).replace(/[\s，。、？！,.?!「」]/g, '')].map(c => EQUIV[c] || c).join('');
function cer(ref, hyp) {
  const a = [...ref], b = [...hyp], d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return { edits: d[a.length][b.length], len: a.length };
}
function pcm(buf) {
  const v = new DataView(buf); let p = 12, off = 0, len = 0;
  while (p + 8 <= buf.byteLength) { const id = String.fromCharCode(...new Uint8Array(buf, p, 4)), size = v.getUint32(p + 4, true); if (id === 'data') { off = p + 8; len = size; } p += 8 + size + (size & 1); }
  const out = new Float32Array(len / 2); for (let i = 0; i < out.length; i++) out[i] = v.getInt16(off + i * 2, true) / 32768;
  return out;
}
const st = document.getElementById('st');
const t0 = performance.now();
const model = await Vosk.createModel(new URL('../../ai/models/vosk-model-small-cn-0.22.tar.gz', location.href).href);
const loadMs = Math.round(performance.now() - t0);
async function recognize(samples) {
  const r = new model.KaldiRecognizer(16000);
  const parts = [];
  let finalDone;
  const final = new Promise(ok => finalDone = ok);
  let finalAsked = false;
  r.on('result', m => { if (m.result.text) parts.push(m.result.text); if (finalAsked) finalDone(); });
  const pad = new Float32Array(16000 * 0.6);
  const all = new Float32Array(samples.length + pad.length); all.set(samples);
  for (let i = 0; i < all.length; i += 4096) r.acceptWaveformFloat(all.subarray(i, i + 4096), 16000);
  finalAsked = true; r.retrieveFinalResult();
  await Promise.race([final, new Promise(ok => setTimeout(ok, 8000))]);
  r.remove();
  return conv(parts.join(' ').replace(/(?<=[㐀-鿿])\s+(?=[㐀-鿿])/g, '').trim());
}
const rows = [], tb = document.querySelector('tbody');
const voices = ['hanhan', 'yating', 'zhiwei'];
for (const kind of ['clean', 'noisy']) for (const v of voices) for (let i = 0; i < SENTENCES.length; i++) {
  const name = `${kind}-${v}-${String(i + 1).padStart(2, '0')}.wav`;
  st.textContent = `辨識中 ${rows.length + 1} / ${SENTENCES.length * voices.length * 2}：${name}`;
  const samples = pcm(await (await fetch(DIR + name)).arrayBuffer());
  const s0 = performance.now();
  const hyp = await recognize(samples);
  const ms = Math.round(performance.now() - s0);
  const [ref, want] = SENTENCES[i];
  const c = cer(norm(ref), norm(hyp));
  const got = classify(hyp, { now: NOW }).intent;
  rows.push({ name, kind, voice: v, ref, hyp, edits: c.edits, len: c.len, want, got, ok: got === want, ms, sec: samples.length / 16000 });
  const tr = document.createElement('tr'); if (got !== want) tr.className = 'bad';
  for (const t of [name, ref, hyp, (c.edits / c.len * 100).toFixed(0) + '%', want, got]) { const td = document.createElement('td'); td.textContent = t; tr.append(td); }
  tb.append(tr);
}
model.terminate();
const sum = {};
for (const kind of ['clean', 'noisy', 'all']) {
  const rs = rows.filter(r => kind === 'all' || r.kind === kind);
  const edits = rs.reduce((a, r) => a + r.edits, 0), len = rs.reduce((a, r) => a + r.len, 0);
  sum[kind] = { clips: rs.length, CER: +(edits / len * 100).toFixed(2), intentAccuracy: +(rs.filter(r => r.ok).length / rs.length * 100).toFixed(2),
    intentErrors: rs.filter(r => !r.ok).length, avgRecognizeMs: Math.round(rs.reduce((a, r) => a + r.ms, 0) / rs.length),
    realTimeFactor: +(rs.reduce((a, r) => a + r.ms / 1000, 0) / rs.reduce((a, r) => a + r.sec, 0)).toFixed(3) };
}
sum.modelLoadMs = loadMs;
for (const v of voices) sum[v] = { intentAccuracy: +(rows.filter(r => r.voice === v && r.ok).length / rows.filter(r => r.voice === v).length * 100).toFixed(2) };
window.__t02 = { set: SET, summary: sum, rows };
document.getElementById('sum').textContent = JSON.stringify(sum, null, 2);
st.textContent = '完成';
</script>
</body>
</html>
