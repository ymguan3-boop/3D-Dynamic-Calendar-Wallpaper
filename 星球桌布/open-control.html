<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星球居民及行事曆管理</title>
<link rel="icon" href="assets/manager.png">
<style>
  :root{--linen:#f3eadb;--paper:#fbf6ea;--line:#dcc8a6;--stitch:#bfa27b;--wood-d:#5b3a24;--ink:#3e2c20;--ink-dim:#7c6550;
    --serif:"Noto Serif TC","Source Han Serif TC","PMingLiU","新細明體",Georgia,serif}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;
    background:repeating-linear-gradient(0deg,rgba(120,88,58,.045) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(120,88,58,.04) 0 1px,transparent 1px 4px),var(--linen)}
  .card{width:min(340px,86vw);padding:26px 22px 22px;border-radius:12px;background:var(--paper);border:1px solid var(--line);text-align:center;
    outline:1.5px dashed var(--stitch);outline-offset:-7px;box-shadow:0 2px 0 #d9c6a2,0 8px 18px rgba(91,58,36,.12)}
  .card img{width:62px;height:62px;display:block;margin:0 auto 6px}
  h1{margin:0 0 10px;font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--wood-d)}
  p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-dim)}
  .credit{position:fixed;right:10px;bottom:8px;font-size:11.5px;letter-spacing:.18em;color:var(--wood-d);font-family:var(--serif);
    padding:3px 10px;border-radius:999px;background:rgba(251,246,234,.92);border:1px dashed var(--stitch)}
</style>
</head>
<body>
  <div class="card">
    <img src="assets/manager.png" alt="">
    <h1 id="h">開啟中…</h1>
    <p id="p">正在連線到小公主的星球桌布。</p>
  </div>
  <div class="credit">創作人 官毅明</div>
<script>
  // 管理頁面由桌布程式在本機（127.0.0.1）提供；桌布沒有執行時顯示提示
  const BASE = 'http://127.0.0.1:47826/';
  let tries = 0;
  function attempt() {
    // /ping 是服務唯一允許跨來源讀取的位址（內容只有 ok）；Edge 會擋 no-cors 的本機請求，所以用一般 cors
    fetch(BASE + 'ping', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(); location.replace(BASE + (location.hash === '#chat' ? 'princess-chat.html' : 'control.html')); })
      .catch(() => {
        if (++tries < 6) { setTimeout(attempt, 1000); return; }
        document.getElementById('h').textContent = '星球桌布目前沒有執行';
        document.getElementById('p').innerHTML = '請從「開始功能表 → 星球桌布 → 啟動星球桌布」開啟桌布，<br>再重新打開這個視窗。';
      });
  }
  attempt();
</script>
</body>
</html>
